[backdrop]
blur_intensity = 0.13999999687075615
tint_intensity = 0.14999999664723873

[bar.default]
background_opacity = 0.29999999329447746
end = [ "notifications", "bluetooth", "network", "battery", "session" ]
start = [ "workspaces", "cpu", "temp" ]

[battery]
warning_threshold = 15

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.5623779296875
    cy = 875.25
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."noctalia/wallhaven"]
download_dir = "/home/zwielicht/Pictures"

[plugins]
enabled = [ "noctalia/wallhaven" ]

[shell]
font_family = "FiraCode Nerd Font"

    [shell.animation]
    speed = 0.2500000037252903

    [shell.launcher]
    categories = false
    compact = true
    fetch_exchange_rates = false

        [shell.launcher.providers.session]
        global = false

        [shell.launcher.providers.wallpaper]
        global = false

    [shell.shadow]
    alpha = 0.4999999888241291
    direction = "center"

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "kitty" ]

[wallpaper]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/zwielicht/Pictures/wallhaven-vpdp98.png"

    [wallpaper.last]
    path = "/home/zwielicht/Pictures/wallhaven-vpdp98.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/zwielicht/Pictures/wallhaven-vpdp98.png"

[widget.bluetooth]
hide_when_no_connected_device = true

[widget.network]
show_label = false

[widget.notifications]
hide_when_no_unread = true
